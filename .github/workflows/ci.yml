name: CI/CD VitalSync

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # Étape 1 : Lint & Tests
  # -------------------------------------------------------
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests (Jest)
        working-directory: ./backend
        run: npm test

      - name: Run linter (ESLint)
        working-directory: ./backend
        run: npm run lint

  # -------------------------------------------------------
  # Étape 2 : Build Docker & Push vers GHCR
  # -------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vitalsync-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend:${{ github.sha }}

  # -------------------------------------------------------
  # Étape 3 : Déploiement staging + Health Check
  # -------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "PORT=3000" >> .env
          echo "POSTGRES_DB=vitalsync_db" >> .env
          echo "POSTGRES_USER=vitalsync_user" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env

      - name: Start services with docker compose
        run: docker compose up -d --build

      - name: Wait for backend to be ready
        run: sleep 10

      - name: Health check
        run: |
          curl --fail http://localhost:3000/health || (docker compose logs backend && exit 1)

      - name: Tear down
        if: always()
        run: docker compose down -v
