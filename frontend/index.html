<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalSync</title>
</head>
<body>
  <h1>VitalSync - Suivi médical et sportif</h1>
  <p id="status">Chargement...</p>
  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((d) => {
        document.getElementById("status").textContent = "API: " + d.status;
      })
      .catch(() => {
        document.getElementById("status").textContent = "API indisponible";
      });
  </script>
</body>
</html>
